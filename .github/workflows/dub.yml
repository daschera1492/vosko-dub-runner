        default: auto
        type: choice
        options:
          - auto
          - export
          - mix
          - voice
      parallel_chunks:
        description: 'هم‌زمانی — چند تکه با هم دوبله شود (1 = مطمئن‌ترین، 5 = سریع‌ترین)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      queue_group:
        description: 'اختیاری — اجراهایی که این مقدارشان یکی است پشت سر هم می‌روند؛ خالی = موازی'
