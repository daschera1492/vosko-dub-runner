        default: ''
        type: string
      proxy_enabled:
        description: 'پروکسی — هر اکانت با یک IP مسکونی جدا (Oxylabs)؛ خاموش = IP خودِ رانر'
        required: true
        default: true
        type: boolean
      proxy_country:
        description: 'کشور خروج پروکسی — auto یعنی بین چند کشور بچرخد (هر اکانت یک کشور)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - us
          - de
          - nl
          - gb
          - fr
          - ca
          - tr
          - ae
          - se
          - pl
          - es
          - it
          - jp
      resume_run_id:
        description: 'ادامهٔ اجرای قبلی — شمارهٔ Run قبلی که خروجی‌اش ادامه داده شود (خالی = از صفر)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'انتشار خروجی — نتیجه به‌صورت Release در گیت‌هاب منتشر شود'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # Each dispatch gets a unique group, so runs execute in parallel by default.
  # Set the optional `queue_group` input to the same value on several runs to
  # make them wait for each other instead.
  group: vosko-dub-${{ inputs.queue_group != '' && inputs.queue_group || github.run_id }}
  cancel-in-progress: false

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          set -e
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed"
          else
            # wait for any background apt/dpkg lock to be released
            sudo systemctl stop unattended-upgrades 2>/dev/null || true
            for i in 1 2 3; do
              echo "apt attempt $i"
              if sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o DPkg::Lock::Timeout=60 update \
                && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o DPkg::Lock::Timeout=60 install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$i" = "3" ]; then
                echo "apt failed 3 times"
                exit 1
              fi
              sleep 10
            done
          fi
          ffmpeg -version | head -n 1

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ inputs.whisper_model }}

      - name: Install Whisper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet openai-whisper

      - name: Fetch live languages and verify selection
        env:
          SOURCE_LANG: ${{ inputs.source_lang }}
          TARGET_LANG: ${{ inputs.target_lang }}
        run: node scripts/languages.mjs --verify "$SOURCE_LANG" "$TARGET_LANG" --summary

      - name: Restore previous work
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: dub-output
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/work

      - name: Dub
        id: dub
        env:
          INPUT_URL: ${{ inputs.video_url }}
          SOURCE_LANG: ${{ inputs.source_lang }}
          TARGET_LANG: ${{ inputs.target_lang }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          VOSKO_PIPELINE: ${{ inputs.pipeline_type }}
          NO_CHUNK: ${{ inputs.no_chunk }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          DEBUG_DUMP: ${{ inputs.debug_dump }}
          MAX_ACCOUNT_TRIES: ${{ inputs.max_account_tries }}
          OTP_WAIT_SECONDS: ${{ inputs.otp_wait_seconds }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          OUTPUT_MODE: ${{ inputs.output_mode }}
          AUDIO_SOURCE: ${{ inputs.audio_source }}
          PARALLEL_CHUNKS: ${{ inputs.parallel_chunks }}
          PROXY_OXYLABS: ${{ secrets.PROXY_OXYLABS }}
          PROXY_ENABLED: ${{ inputs.proxy_enabled }}
          PROXY_COUNTRIES: ${{ inputs.proxy_country == 'auto' && 'us,de,nl,gb' || inputs.proxy_country }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          VDB_BASE_URL: ${{ secrets.VDB_BASE_URL }}
          VDB_KEY: ${{ secrets.VDB_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORK_DIR: ${{ runner.temp }}/work
        run: node scripts/run.mjs

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dub-output
          path: |
            ${{ runner.temp }}/work/state.json
            ${{ runner.temp }}/work/out
          if-no-files-found: warn

      - name: Link
        if: always()
        run: |
          {
            echo '### Result'
            echo ''
            echo "- file: \`${{ steps.dub.outputs.name }}\`"
            echo "- release: ${{ steps.dub.outputs.release_url }}"
            echo "- bridge run: ${{ steps.dub.outputs.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
